<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>CuisineX — accès privé</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f9;color:#17202a}
    main{width:min(92vw,680px);padding:32px;border:1px solid #d9e1e8;border-radius:18px;background:white;box-shadow:0 16px 45px #00000012}
    h1{margin:0 0 10px;font-size:30px}p{line-height:1.55;color:#52606d}
    .badge{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:#eef6ff;color:#165d99;font-weight:700}
    @media(prefers-color-scheme:dark){body{background:#10161d;color:#eef3f7}main{background:#17212b;border-color:#2d3b49}p{color:#b7c3ce}.badge{background:#18334a;color:#8dcbff}}
  </style>
</head>
<body>
<main>
  <h1>🍽️ CuisineX</h1>
  <p>Cette ancienne preview publique a été retirée. Le site CuisineX complet est désormais réservé à la version privée authentifiée.</p>
  <p>L’accès au site actif nécessite un compte Google autorisé et une session CuisineX valide.</p>
  <span class="badge">Accès privé requis</span>
</main>
</body>
</html>
